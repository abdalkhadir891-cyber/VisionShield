name: ShieldGuard Android CI & Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Official Google EfficientDet-Lite2 INT8 (Apache 2.0)
        run: |
          mkdir -p app/src/main/assets/models
          curl -fL "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite2/int8/1/efficientdet_lite2.tflite" \
            -o app/src/main/assets/models/person_detector.tflite
          ls -lh app/src/main/assets/models/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Run All Unit & Integration Tests (Phases 1-5)
        run: gradle testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShieldGuard-Phase5-APK
          path: app/build/outputs/apk/debug/app-debug.apk
